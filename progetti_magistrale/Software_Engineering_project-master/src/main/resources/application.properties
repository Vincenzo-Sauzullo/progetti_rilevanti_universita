# Nome logico dell'applicazione Spring Boot.
# Uso nel codice: non letto direttamente dalle classi applicative; viene esposto da Actuator/log/context.
# Impatto runtime: identifica il servizio in metriche, tracing e log framework.
spring.application.name=springai-rag-assessment

# Porta HTTP del server embedded (Tomcat).
# Uso nel codice: nessun riferimento diretto; gestita dal container web Spring.
# Impatto runtime: definisce l'URL base (es. http://localhost:8080).
server.port=8080

# URL JDBC del database PostgreSQL principale.
# Uso nel codice: consumata da Spring Data JPA e dai repository (es. MacchinarioRepository, AssessmentResultRepository).
# Impatto runtime: determina dove vengono persistiti macchinari, assessment e documenti.
spring.datasource.url=jdbc:postgresql://localhost:5432/ragassessment

# Username per autenticazione al database PostgreSQL.
# Uso nel codice: framework-level (DataSource), non letto direttamente dai service.
# Impatto runtime: senza credenziali valide l'app non avvia il layer persistenza.
spring.datasource.username=postgres

# Password del datasource PostgreSQL.
# Uso nel codice: framework-level.
# Impatto runtime: abilita connessione DB; credenziale errata provoca errori di bootstrap/connessione.
spring.datasource.password=postgres

# Driver JDBC da usare per il datasource.
# Uso nel codice: framework-level.
# Impatto runtime: seleziona il driver Postgres necessario per le query JPA.
spring.datasource.driver-class-name=org.postgresql.Driver

# Strategia schema JPA/Hibernate (`none` = non crea/modifica tabelle automaticamente).
# Uso nel codice: influenza tutte le entita JPA (`Macchinario`, `AssessmentResult`, `DocumentEntity`, ecc.).
# Impatto runtime: richiede schema gia presente/migrato esternamente.
spring.jpa.hibernate.ddl-auto=none

# Abilita/disabilita stampa SQL generato da Hibernate.
# Uso nel codice: diagnostica trasversale, non richiamata da metodi applicativi specifici.
# Impatto runtime: `false` riduce rumore log e overhead console.
spring.jpa.show-sql=false

# Dialetto Hibernate per PostgreSQL.
# Uso nel codice: framework-level nelle query generate dai repository.
# Impatto runtime: produce SQL compatibile con PostgreSQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Formatta SQL nei log Hibernate.
# Uso nel codice: solo osservabilita/debug.
# Impatto runtime: migliora leggibilita log SQL quando la stampa e abilitata.
spring.jpa.properties.hibernate.format_sql=true

# Inizializza automaticamente schema/tabelle PGVector se mancanti.
# Uso nel codice: supporta il bean `VectorStore` usato da `RagService` e `PdfIngestionService`.
# Impatto runtime: prepara struttura storage vettoriale all'avvio.
spring.ai.vectorstore.pgvector.initialize-schema=true

# Tipo indice vettoriale usato da PGVector (`HNSW`).
# Uso nel codice: impatta `vectorStore.similaritySearch(...)` richiamato da `RagService`.
# Impatto runtime: bilancia velocita/accuratezza nelle ricerche semantiche.
spring.ai.vectorstore.pgvector.index-type=HNSW

# Metrica distanza per similarity search vettoriale.
# Uso nel codice: influenza risultati di `RagService.searchRelevantDocuments(...)`.
# Impatto runtime: definisce come viene misurata la vicinanza tra embedding.
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Dimensione attesa dei vettori embedding salvati in PGVector.
# Uso nel codice: coerente con modello embedding configurato (Ollama `nomic-embed-text`).
# Impatto runtime: mismatch dimensionale causerebbe errori in inserimento/ricerca vettori.
spring.ai.vectorstore.pgvector.dimensions=768

# API key provider OpenAI-compatible (qui Regolo.ai).
# Uso nel codice: usata dal bean `ChatClient.Builder` in `ChatbotService`, `AssessmentService`,
# `AssessmentChatService` e `MachineManualExtractionService`.
# Impatto runtime: senza chiave valida le chiamate LLM chat falliscono.
spring.ai.openai.api-key=sk-1gcRxla6khg1vlZ-ppmiIQ

# Base URL del provider chat OpenAI-compatible.
# Uso nel codice: indirettamente in tutte le chiamate `chatClientBuilder.build().prompt()`.
# Impatto runtime: punta al gateway LLM effettivo da interrogare.
spring.ai.openai.base-url=https://api.regolo.ai

# Modello chat predefinito per generazione risposte/assessment.
# Uso nel codice: impatta output di `ChatbotService.chat`, `AssessmentService.generateAssessment`,
# `AssessmentChatService.chat` e `MachineManualExtractionService.extractFromManual`.
# Impatto runtime: varia costo, latenza e qualita del testo generato.
spring.ai.openai.chat.options.model=Llama-3.3-70B-Instruct

# Temperatura di generazione chat (creativita/stocasticita).
# Uso nel codice: applicata globalmente alle chiamate ChatClient non override.
# Impatto runtime: valori alti aumentano variabilita, valori bassi aumentano determinismo.
spring.ai.openai.chat.options.temperature=0.7

# Numero massimo token generabili dal modello chat per singola risposta.
# Uso nel codice: influenza output lunghi (assessment estesi, spiegazioni dettagliate).
# Impatto runtime: limita lunghezza risposta e costo per richiesta.
spring.ai.openai.chat.options.max-tokens=4096

# Endpoint Ollama locale usato per il modello embedding.
# Uso nel codice: impatta pipeline di ingestione (`PdfIngestionService.processAndStoreEmbeddings`).
# Impatto runtime: embedding locali non disponibili se servizio Ollama non raggiungibile.
spring.ai.ollama.base-url=http://localhost:11434

# Modello embedding Ollama utilizzato per vectorizzazione chunk PDF.
# Uso nel codice: coerente con dimensione vettori attesa da PGVector (768).
# Impatto runtime: determina qualita retrieval semantico in `RagService`.
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Disattiva provider chat Ollama per evitare conflitto con provider OpenAI-compatible.
# Uso nel codice: framework-level, i service chat usano `ChatClient.Builder` configurato su OpenAI-compatible.
# Impatto runtime: fornisce una sola sorgente chat (Regolo/OpenAI-compatible).
spring.ai.ollama.chat.enabled=false

# Disattiva provider embedding OpenAI/Regolo.
# Uso nel codice: forza uso embedding Ollama nella pipeline documentale.
# Impatto runtime: evita costi remoti embedding e mismatch provider.
spring.ai.openai.embedding.enabled=false

# Abilita gestione richieste multipart/form-data.
# Uso nel codice: necessario per `DocumentController.uploadPdf` e `MacchinarioController.extractFromManual`.
# Impatto runtime: senza questa opzione gli upload file non vengono processati.
spring.servlet.multipart.enabled=true

# Dimensione massima consentita per singolo file uploadato.
# Uso nel codice: vincolo applicato prima della logica controller/service.
# Impatto runtime: upload oltre 50MB vengono rifiutati dal layer web.
spring.servlet.multipart.max-file-size=50MB

# Dimensione massima complessiva di una richiesta multipart.
# Uso nel codice: copre richieste con uno o piu file/parti.
# Impatto runtime: protegge memoria e previene richieste troppo pesanti.
spring.servlet.multipart.max-request-size=50MB

# Disabilita cache template Thymeleaf (utile in sviluppo).
# Uso nel codice: impatta rendering pagina login gestita da `WebController.login`.
# Impatto runtime: modifica template visibili senza restart, con lieve overhead.
spring.thymeleaf.cache=false

# Prefisso path template Thymeleaf.
# Uso nel codice: usato dal view resolver quando un controller MVC ritorna un nome vista (es. `login`).
# Impatto runtime: determina directory di risoluzione template.
spring.thymeleaf.prefix=classpath:/templates/

# Suffisso file template Thymeleaf.
# Uso nel codice: combinato con il nome vista di `WebController.login` -> `login.html`.
# Impatto runtime: limita estensione template risolvibili.
spring.thymeleaf.suffix=.html

# Livello log package applicativo.
# Uso nel codice: rende visibili log `log.info/debug/error` presenti nei controller/service.
# Impatto runtime: `DEBUG` aumenta dettaglio diagnostico e volume log.
logging.level.it.unicas.spring.springai=DEBUG

# Livello log libreria Spring AI.
# Uso nel codice: utile per tracciare retrieval/chiamate modello.
# Impatto runtime: facilita debug pipeline AI ma puo aumentare rumore log.
logging.level.org.springframework.ai=DEBUG

# Livello log sicurezza Spring.
# Uso nel codice: osservabilita del flusso login/autorizzazione.
# Impatto runtime: `INFO` mantiene eventi principali senza eccessivo dettaglio.
logging.level.org.springframework.security=INFO

# Esegue sempre script SQL di inizializzazione all'avvio.
# Uso nel codice: framework-level; utile per creare/seminare tabelle di base prima dell'uso repository.
# Impatto runtime: ogni bootstrap applica script SQL configurati nel classpath.
spring.sql.init.mode=always
