# Nome logico dell'app nel profilo test.
# Uso nel codice: non letto direttamente dai test; utile per distinguere contesto nei log.
# Impatto runtime: etichetta il context Spring di test.
spring.application.name=springai-rag-assessment-test

# URL database H2 in memoria con compatibilita sintattica PostgreSQL.
# Uso nel codice: alimenta repository JPA usati nei test integrazione.
# Impatto runtime: ogni suite usa DB volatile isolato, senza dipendere da PostgreSQL reale.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL

# Driver JDBC H2 per il profilo test.
# Uso nel codice: framework-level DataSource.
# Impatto runtime: abilita connessione al DB in-memory.
spring.datasource.driver-class-name=org.h2.Driver

# Username datasource test H2.
# Uso nel codice: framework-level.
# Impatto runtime: credenziale di default per H2 in-memory.
spring.datasource.username=sa

# Password datasource test H2 (vuota per default H2 locale).
# Uso nel codice: framework-level.
# Impatto runtime: mantiene configurazione semplice in ambiente CI/local test.
spring.datasource.password=

# Crea e distrugge schema automaticamente a ogni sessione test.
# Uso nel codice: influenza tutte le entita/repository durante test JPA.
# Impatto runtime: garantisce isolamento e pulizia tra esecuzioni.
spring.jpa.hibernate.ddl-auto=create-drop

# Disattiva stampa SQL nei test per ridurre rumore output.
# Uso nel codice: solo diagnostica.
# Impatto runtime: log test piu leggibili.
spring.jpa.show-sql=false

# API key fittizia nel profilo test.
# Uso nel codice: i test mockano `ChatClient.Builder`, quindi non deve essere reale.
# Impatto runtime: evita uso accidentale di credenziali produzione.
spring.ai.openai.api-key=test-key

# Base URL fittizia per provider AI in test.
# Uso nel codice: non chiamato realmente quando il ChatClient e mockato.
# Impatto runtime: previene chiamate esterne involontarie durante test.
spring.ai.openai.base-url=http://localhost:8081

# Evita inizializzazione schema PGVector nei test.
# Uso nel codice: coerente con `VectorStore` mockato in quasi tutti i test integrazione.
# Impatto runtime: accelera bootstrap test ed evita dipendenze da estensioni DB esterne.
spring.ai.vectorstore.pgvector.initialize-schema=false
