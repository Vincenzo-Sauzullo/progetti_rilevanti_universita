<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Report Eventi e Compensi</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background-color: #f9f9f9;
      color: #333;
      padding: 20px;
      margin: 0;
    }

    h1 {
      text-align: center;
      color: #007BFF;
      margin-bottom: 40px;
    }

    .section {
      margin: 0 auto 40px auto;
      max-width: 900px;
      padding: 0 10px;
    }

    h2 {
      color: #007BFF;
      border-bottom: 2px solid #007BFF;
      padding-bottom: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background-color: white;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.05);
    }

    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: #007BFF;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 60px;
    }
  </style>
</head>
<body>

<h1>Report Attività Musicali</h1>

<div class="section">
  <h2>Eventi</h2>
  <table>
    <thead>
    <tr>
      <th>Data</th>
      <th>Luogo</th>
      <th>Tipologia</th>
    </tr>
    </thead>
    <tbody>
    {{ eventiRows }}
    <!-- Esempio:
    <tr>
      <td>18/05/2025</td>
      <td>Teatro Verdi</td>
      <td>Concerto</td>
    </tr>
    -->
    </tbody>
  </table>
</div>

<div class="section">
  <h2>Compensi Musicisti</h2>
  <table>
    <thead>
    <tr>
      <th>Nome e cognome</th>
      <th>Compenso (€)</th>
    </tr>
    </thead>
    <tbody>
    {{ compensiRows }}
    <!-- Esempio:
    <tr>
      <td>Luca Bianchi</td>
      <td>250</td>
    </tr>
    -->
    </tbody>
  </table>
</div>

<div class="footer">
  Report generato automaticamente da Eventi Musicali
</div>

</body>
</html>
